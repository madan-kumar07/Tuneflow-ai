spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# ==============================
# DATABASE (Railway / Render / Local)
# ==============================

spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tuneflow}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}

# ==============================
# SERVER (Render dynamic PORT)
# ==============================

server.address=0.0.0.0
server.port=${PORT:8080}

# ==============================
# CORS
# ==============================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://tuneflow-ai.vercel.app}

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:1234567890123456789012345678901212345678901234567890123456789012}

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# YOUTUBE
# ==============================

youtube.api.key=${YOUTUBE_API_KEY:}

# ==============================
# EMAIL (Gmail SMTP / Resend)
# ==============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

resend.api.key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:onboarding@resend.dev}}
