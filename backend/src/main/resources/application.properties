spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# ==============================
# DATABASE (Railway / Render / Local)
# ==============================

spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tuneflow}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}

# ==============================
# SERVER (Render dynamic PORT)
# ==============================

server.address=0.0.0.0
server.port=${PORT:8080}

# ==============================
# CORS
# ==============================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:1234567890123456789012345678901212345678901234567890123456789012}

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# YOUTUBE
# ==============================

youtube.api.key=${YOUTUBE_API_KEY:}

# ==============================
# EMAIL / OTP - RESEND API
# ==============================

resend.api.key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
